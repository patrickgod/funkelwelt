# Build Funkelwelt and publish it to GitHub Pages.
#
# Unlike Tidegarden's workflow, this one publishes from the same repo it
# builds in. Tidegarden keeps a private source repo and force-pushes a
# built slice to a public one because it is a commercial game with art
# pipelines and design notes worth keeping back. Funkelwelt is a small
# learning game for one child and possibly his class: there is nothing
# here to keep back, and a single public repo is one fewer moving part
# to explain to whoever picks this up next.
#
# Everything the app needs is relative — `main.js`, `style.css`,
# `sw.js`, `assets/`, `icons/` — so it works unchanged at
# `/funkelwelt/` on github.io and at the root of a custom domain.

name: deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # The lockfile is the cache key, so this is a hit on every run
          # that does not change dependencies — which is nearly all of
          # them.
          cache: npm

      # `npm ci` took SEVEN MINUTES for five packages.
      #
      # The same command takes two seconds on the machine this was
      # written on, so it is not the packages — it is a postinstall
      # script. `playwright` fetches Chromium, Firefox and WebKit from
      # one, and this project uses one browser, installed by its own
      # step below.
      #
      # `--ignore-scripts` skips all of them. esbuild has not needed a
      # postinstall since 0.16 — it ships its platform binary as an
      # optional dependency — and if that ever changes the Build step
      # two lines down fails immediately, which is the right place to
      # find out.
      #
      # The timeout is a tripwire rather than a budget: this should be
      # seconds, and if it is ever minutes again somebody should look
      # rather than wait.
      - name: Install
        timeout-minutes: 4
        run: npm ci --ignore-scripts --no-audit --no-fund

      # A broken build must never reach a child's iPad, so everything
      # runs before anything is uploaded.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # NOT --with-deps: that shells out to apt-get and is a known way
      # to hang a runner. The GitHub image already carries what
      # Chromium needs.
      - name: Install a browser for the harness
        timeout-minutes: 4
        run: npx playwright install chromium

      # Loads the built files the way a child's browser will, at a real
      # iPad viewport with touch on, and plays a whole round with taps.
      # Twelve, not five.
      #
      # Five was chosen when the suite took two minutes. The third house
      # took it to five minutes and one second, so a run that printed
      # `all good` was killed on the line after it and the deploy failed
      # with a green suite in the log — the worst kind of red, because
      # it says the game is broken when the game is fine.
      #
      # This number is a CEILING for a hang, not a budget. If the suite
      # ever gets near it the answer is to make the suite faster, not to
      # raise this again: every check in it drives a real browser through
      # a real round, and there are only so many of those a person will
      # wait for before they stop running it.
      - name: Verify it actually runs
        timeout-minutes: 12
        run: node tools/verify.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
