<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<!-- Every part of this is load-bearing on an iPad. Lifted from
     LernInseln's IPAD.md, where each line was a bug first. -->
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#241d2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Funkelwelt">
<meta name="description" content="Funkelwelt - ein kleines Abenteuer, in dem Wissen Licht macht.">
<title>Funkelwelt</title>
<link rel="manifest" href="manifest.webmanifest">
<!-- One apple-touch-icon per size iOS actually draws, because Safari
     picks the nearest and then rescales, and a rescaled pixel icon is
     a smudge. 152 is an iPad at 2x, 167 an iPad Pro, 180 an iPhone. -->
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
<link rel="apple-touch-icon" sizes="120x120" href="icons/icon-120.png">
<link rel="icon" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" sizes="64x64" href="icons/icon-64.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <canvas id="welt"></canvas>
  <div id="ui"></div>
  <canvas id="fx"></canvas>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
